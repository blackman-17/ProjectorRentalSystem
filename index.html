<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Projector Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 font-sans text-slate-800">

  <div class="max-w-lg w-full bg-white rounded-2xl p-6 shadow-md border border-slate-200">
    <div class="mb-5">
      <h1 class="text-2xl font-bold text-slate-900">📽️ Rent Cinema Projector</h1>
      <p class="text-xs text-slate-500 mt-1">Pickup (6:00 PM – 2:30 AM) • Return by 6:00 AM Max</p>
    </div>

    <form id="rentalForm" class="space-y-4">
      
      <!-- Personal Details -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold uppercase text-slate-600">Your Name</label>
          <input type="text" id="name" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Rahul Sharma">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-600">Phone / WhatsApp</label>
          <input type="tel" id="phone" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="9876543210">
        </div>
      </div>

      <!-- Room Details -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold uppercase text-slate-600">Your Block</label>
          <input type="text" id="userBlock" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Block 9">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-600">Your Room No.</label>
          <input type="text" id="userRoom" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. 302">
        </div>
      </div>

      <!-- Pickup Location -->
      <div>
        <label class="text-xs font-semibold uppercase text-slate-600">Pickup & Return Location</label>
        <select id="pickupLocation" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm mt-1 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <option value="Block 9 - Room 467">Block 9 — Room 467</option>
          <option value="Block 9 - Room 149">Block 9 — Room 149</option>
        </select>
      </div>

      <!-- Pickup Date & Time -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold uppercase text-slate-600">Rental Date</label>
          <input type="date" id="pickupDate" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-600">Pickup Time (Max 2:30 AM)</label>
          <select id="pickupTime" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm mt-1 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <!-- Populated from 6:00 PM to 02:30 AM strictly -->
          </select>
        </div>
      </div>

      <!-- Return Date & Return Time (Strictly max 6:00 AM next morning) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold uppercase text-slate-600">Return Date</label>
          <select id="returnDate" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm mt-1 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <!-- Populated with Date X or Date X+1 -->
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold uppercase text-slate-600">Return Time (Max 6:00 AM)</label>
          <select id="returnTime" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm mt-1 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <!-- Dynamically populated up to 6:00 AM -->
          </select>
        </div>
      </div>

      <!-- Duration Summary Alert -->
      <div id="durationDisplay" class="text-xs font-medium text-blue-700 bg-blue-50 border border-blue-100 p-2.5 rounded-lg text-center">
        Calculating duration...
      </div>

      <!-- Add-ons -->
      <div>
        <label class="text-xs font-semibold uppercase text-slate-600 block mb-2">Select Add-ons</label>
        <div class="space-y-2">
          
          <label class="flex items-center justify-between p-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer transition">
            <div class="flex items-center gap-2">
              <input type="checkbox" id="speakerAddon" class="w-4 h-4 text-blue-600 rounded">
              <div>
                <p class="text-sm font-medium text-slate-800">External Speakers</p>
                <p class="text-xs text-slate-500">₹25 up to 3 hrs (+₹10/hr extra)</p>
              </div>
            </div>
            <span id="speakerPriceLabel" class="text-sm font-semibold text-slate-700">₹25</span>
          </label>

          <label class="flex items-center justify-between p-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer transition">
            <div class="flex items-center gap-2">
              <input type="checkbox" id="netflixAddon" class="w-4 h-4 text-blue-600 rounded">
              <div>
                <p class="text-sm font-medium text-slate-800">Netflix Access (In-built)</p>
                <p class="text-xs text-slate-500">Active profile login on projector</p>
              </div>
            </div>
            <span class="text-sm font-semibold text-slate-700">+₹10</span>
          </label>

          <label class="flex items-center justify-between p-3 border border-slate-200 rounded-lg hover:bg-slate-50 cursor-pointer transition">
            <div class="flex items-center gap-2">
              <input type="checkbox" id="hdmiAddon" class="w-4 h-4 text-blue-600 rounded">
              <div>
                <p class="text-sm font-medium text-slate-800">HDMI Cable</p>
                <p class="text-xs text-slate-500">High speed laptop connection</p>
              </div>
            </div>
            <span class="text-sm font-semibold text-slate-700">+₹10</span>
          </label>

        </div>
      </div>

      <!-- Price Breakdown -->
      <div class="p-4 bg-slate-50 rounded-xl space-y-1.5 text-sm border border-slate-200">
        <div class="flex justify-between text-slate-600">
          <span>Projector Rent</span>
          <span id="projPrice">₹50</span>
        </div>
        <div id="speakerRow" class="flex justify-between text-slate-600 hidden">
          <span>Speakers Rent</span>
          <span id="speakerSubtotal">₹25</span>
        </div>
        <div id="netflixRow" class="flex justify-between text-slate-600 hidden">
          <span>Netflix Profile</span>
          <span>₹10</span>
        </div>
        <div id="hdmiRow" class="flex justify-between text-slate-600 hidden">
          <span>HDMI Cable</span>
          <span>₹10</span>
        </div>
        <hr class="my-2 border-slate-200">
        <div class="flex justify-between font-bold text-slate-900 text-base">
          <span>Total Amount</span>
          <span id="grandTotal">₹50</span>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 transition">
        Confirm Booking
      </button>
    </form>
  </div>

  <script>
    const BASE_PROJECTOR_PRICE_3HRS = 50;
    const PROJECTOR_HOURLY_RATE = 10;
    
    const BASE_SPEAKER_PRICE_3HRS = 25;
    const SPEAKER_HOURLY_RATE = 10;

    const NETFLIX_PRICE = 10;
    const HDMI_PRICE = 10;

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEH6ig6v1SYPtdt3KD4oGN-vnIx0ts68V8ZwgfIX2VN1CB_9UMXoNX-bjJAvnFALy6/exec";

    const pickupDateInput = document.getElementById('pickupDate');
    const pickupTimeSelect = document.getElementById('pickupTime');
    const returnDateSelect = document.getElementById('returnDate');
    const returnTimeSelect = document.getElementById('returnTime');

    const durationDisplay = document.getElementById('durationDisplay');
    const speakerCheck = document.getElementById('speakerAddon');
    const netflixCheck = document.getElementById('netflixAddon');
    const hdmiCheck = document.getElementById('hdmiAddon');

    // All slots extending to 6:00 AM next morning (720 minutes total from 6 PM)
    const ALL_SLOTS = [
      { label: "06:00 PM", offsetMinutes: 0, dayOffset: 0 },
      { label: "06:30 PM", offsetMinutes: 30, dayOffset: 0 },
      { label: "07:00 PM", offsetMinutes: 60, dayOffset: 0 },
      { label: "07:30 PM", offsetMinutes: 90, dayOffset: 0 },
      { label: "08:00 PM", offsetMinutes: 120, dayOffset: 0 },
      { label: "08:30 PM", offsetMinutes: 150, dayOffset: 0 },
      { label: "09:00 PM", offsetMinutes: 180, dayOffset: 0 },
      { label: "09:30 PM", offsetMinutes: 210, dayOffset: 0 },
      { label: "10:00 PM", offsetMinutes: 240, dayOffset: 0 },
      { label: "10:30 PM", offsetMinutes: 270, dayOffset: 0 },
      { label: "11:00 PM", offsetMinutes: 300, dayOffset: 0 },
      { label: "11:30 PM", offsetMinutes: 330, dayOffset: 0 },
      { label: "12:00 AM (Midnight)", offsetMinutes: 360, dayOffset: 1 },
      { label: "12:30 AM (Next Day)", offsetMinutes: 390, dayOffset: 1 },
      { label: "01:00 AM (Next Day)", offsetMinutes: 420, dayOffset: 1 },
      { label: "01:30 AM (Next Day)", offsetMinutes: 450, dayOffset: 1 },
      { label: "02:00 AM (Next Day)", offsetMinutes: 480, dayOffset: 1 },
      { label: "02:30 AM (Next Day)", offsetMinutes: 510, dayOffset: 1 }, // Max pickup slot
      { label: "03:00 AM (Next Day)", offsetMinutes: 540, dayOffset: 1 },
      { label: "03:30 AM (Next Day)", offsetMinutes: 570, dayOffset: 1 },
      { label: "04:00 AM (Next Day)", offsetMinutes: 600, dayOffset: 1 },
      { label: "04:30 AM (Next Day)", offsetMinutes: 630, dayOffset: 1 },
      { label: "05:00 AM (Next Day)", offsetMinutes: 660, dayOffset: 1 },
      { label: "05:30 AM (Next Day)", offsetMinutes: 690, dayOffset: 1 },
      { label: "06:00 AM (Next Day)", offsetMinutes: 720, dayOffset: 1 }  // Max return slot
    ];

    // Set today as min date
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    pickupDateInput.min = todayStr;
    pickupDateInput.value = todayStr;

    // Pickup time allowed ONLY up to 02:30 AM (offsetMinutes <= 510)
    function populatePickupTimes() {
      pickupTimeSelect.innerHTML = "";
      ALL_SLOTS.filter(slot => slot.offsetMinutes <= 510).forEach((slot, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.innerText = `${slot.label} ${slot.dayOffset === 1 ? '(Early Morning)' : ''}`;
        pickupTimeSelect.appendChild(opt);
      });
    }

    // Populate Return Date strictly with Date X or Date X+1
    function updateReturnDates() {
      if (!pickupDateInput.value) return;
      const baseDate = new Date(pickupDateInput.value);
      const nextDate = new Date(baseDate);
      nextDate.setDate(baseDate.getDate() + 1);

      const baseStr = baseDate.toISOString().split('T')[0];
      const nextStr = nextDate.toISOString().split('T')[0];

      const currentReturnVal = returnDateSelect.value;
      returnDateSelect.innerHTML = "";

      const pickupIdx = parseInt(pickupTimeSelect.value) || 0;
      const pickupSlot = ALL_SLOTS[pickupIdx];

      // If pickup is already after midnight, only Date X+1 is valid
      if (pickupSlot.dayOffset === 0) {
        const opt1 = document.createElement('option');
        opt1.value = baseStr;
        opt1.innerText = `Same Night (${baseDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })})`;
        returnDateSelect.appendChild(opt1);
      }

      const opt2 = document.createElement('option');
      opt2.value = nextStr;
      opt2.innerText = `Next Morning (${nextDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })})`;
      returnDateSelect.appendChild(opt2);

      if (currentReturnVal === nextStr || pickupSlot.dayOffset === 1 || pickupIdx >= 6) {
        returnDateSelect.value = nextStr;
      } else {
        returnDateSelect.value = baseStr;
      }

      updateReturnTimes();
    }

    // Populate Return Times up to 6:00 AM next morning with 10-minute minimum turnaround
    function updateReturnTimes() {
      const pickupIdx = parseInt(pickupTimeSelect.value) || 0;
      const pickupSlot = ALL_SLOTS[pickupIdx];
      const baseDateStr = pickupDateInput.value;
      const isNextDay = returnDateSelect.value !== baseDateStr;

      returnTimeSelect.innerHTML = "";

      ALL_SLOTS.forEach((slot, index) => {
        const isValidTime = slot.offsetMinutes >= (pickupSlot.offsetMinutes + 30); // minimum 30 min booking

        if (!isNextDay && slot.dayOffset === 0 && isValidTime) {
          const opt = document.createElement('option');
          opt.value = index;
          opt.innerText = slot.label;
          returnTimeSelect.appendChild(opt);
        }
        
        if (isNextDay && slot.dayOffset === 1 && isValidTime) {
          const opt = document.createElement('option');
          opt.value = index;
          opt.innerText = slot.label;
          returnTimeSelect.appendChild(opt);
        }
      });

      // Fallback if same night has no remaining slots
      if (returnTimeSelect.options.length === 0 && !isNextDay) {
        returnDateSelect.value = returnDateSelect.options[returnDateSelect.options.length - 1].value;
        updateReturnTimes();
        return;
      }

      calculate();
    }

    function calculate() {
      const pickupIdx = parseInt(pickupTimeSelect.value);
      const returnIdx = parseInt(returnTimeSelect.value);

      if (isNaN(pickupIdx) || isNaN(returnIdx)) {
        durationDisplay.innerText = "⚠️ Please select a valid pickup & return time.";
        durationDisplay.className = "text-xs font-medium text-red-600 bg-red-50 border border-red-100 p-2.5 rounded-lg text-center";
        return null;
      }

      const pickupSlot = ALL_SLOTS[pickupIdx];
      const returnSlot = ALL_SLOTS[returnIdx];

      const totalMinutes = returnSlot.offsetMinutes - pickupSlot.offsetMinutes;
      if (totalMinutes <= 0) {
        durationDisplay.innerText = "⚠️ Return time must be after pickup time.";
        durationDisplay.className = "text-xs font-medium text-red-600 bg-red-50 border border-red-100 p-2.5 rounded-lg text-center";
        return null;
      }

      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      // Billing: First 3 hours base, +₹10/hr after
      let extraBilledHours = 0;
      if (totalMinutes > 180) { // More than 3 hours
        const extraMinutes = totalMinutes - 180;
        extraBilledHours = Math.ceil(extraMinutes / 60);
      }

      durationDisplay.innerText = `⏱️ Duration: ${hours}h ${minutes}m (Billed: 3h Base + ${extraBilledHours}h Extra • +10m Cleaning Buffer)`;
      durationDisplay.className = "text-xs font-medium text-blue-700 bg-blue-50 border border-blue-100 p-2.5 rounded-lg text-center";

      // 1. Projector Total
      const projectorTotal = BASE_PROJECTOR_PRICE_3HRS + (extraBilledHours * PROJECTOR_HOURLY_RATE);
      document.getElementById('projPrice').innerText = `₹${projectorTotal}`;

      // 2. Speaker Total
      let speakerTotal = 0;
      const speakerPreview = BASE_SPEAKER_PRICE_3HRS + (extraBilledHours * SPEAKER_HOURLY_RATE);
      if (speakerCheck.checked) {
        speakerTotal = speakerPreview;
        document.getElementById('speakerRow').classList.remove('hidden');
        document.getElementById('speakerSubtotal').innerText = `₹${speakerTotal}`;
        document.getElementById('speakerPriceLabel').innerText = `+₹${speakerTotal}`;
      } else {
        document.getElementById('speakerRow').classList.add('hidden');
        document.getElementById('speakerPriceLabel').innerText = `₹${speakerPreview}`;
      }

      // 3. Fixed Add-ons
      const netflixTotal = netflixCheck.checked ? NETFLIX_PRICE : 0;
      document.getElementById('netflixRow').classList.toggle('hidden', !netflixCheck.checked);

      const hdmiTotal = hdmiCheck.checked ? HDMI_PRICE : 0;
      document.getElementById('hdmiRow').classList.toggle('hidden', !hdmiCheck.checked);

      const grandTotal = projectorTotal + speakerTotal + netflixTotal + hdmiTotal;
      document.getElementById('grandTotal').innerText = `₹${grandTotal}`;

      // Build strings
      const baseDate = new Date(pickupDateInput.value);
      
      const pickupDateObj = new Date(baseDate);
      pickupDateObj.setDate(baseDate.getDate() + pickupSlot.dayOffset);
      const pickupFullStr = `${pickupDateObj.toLocaleDateString('en-GB')} ${pickupSlot.label}`;

      const returnDateObj = new Date(baseDate);
      returnDateObj.setDate(baseDate.getDate() + returnSlot.dayOffset);
      const returnFullStr = `${returnDateObj.toLocaleDateString('en-GB')} ${returnSlot.label}`;

      return {
        pickupFullStr,
        returnFullStr,
        formattedDuration: `${hours}h ${minutes}m (+10m Buffer)`,
        grandTotal,
        speakerTotal
      };
    }

    // Init flow
    populatePickupTimes();
    updateReturnDates();

    pickupDateInput.addEventListener('change', updateReturnDates);
    pickupTimeSelect.addEventListener('change', updateReturnDates);
    returnDateSelect.addEventListener('change', updateReturnTimes);
    returnTimeSelect.addEventListener('change', calculate);
    speakerCheck.addEventListener('change', calculate);
    netflixCheck.addEventListener('change', calculate);
    hdmiCheck.addEventListener('change', calculate);

    // Form Submit
    document.getElementById('rentalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const calc = calculate();
      if (!calc) return;

      const btn = document.getElementById('submitBtn');
      btn.innerText = "Submitting Booking...";
      btn.disabled = true;

      const addons = [];
      if (speakerCheck.checked) addons.push(`Speakers (₹${calc.speakerTotal})`);
      if (netflixCheck.checked) addons.push("Netflix (₹10)");
      if (hdmiCheck.checked) addons.push("HDMI (₹10)");

      const formData = new URLSearchParams();
      formData.append("name", document.getElementById('name').value);
      formData.append("phone", document.getElementById('phone').value);
      formData.append("userBlock", document.getElementById('userBlock').value);
      formData.append("userRoom", document.getElementById('userRoom').value);
      formData.append("pickupLocation", document.getElementById('pickupLocation').value);
      formData.append("pickupDateTime", calc.pickupFullStr);
      formData.append("returnDateTime", calc.returnFullStr);
      formData.append("duration", calc.formattedDuration);
      formData.append("addons", addons.length ? addons.join(", ") : "None");
      formData.append("totalPrice", calc.grandTotal);

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        });
        alert(`🎬 Booking Confirmed for ${document.getElementById('name').value}!\n\nPickup: ${calc.pickupFullStr}\nReturn: ${calc.returnFullStr}\nTotal Amount: ₹${calc.grandTotal}\nPickup Location: ${document.getElementById('pickupLocation').value}`);
        location.reload();
      } catch (err) {
        alert("There was an issue logging your booking. Please try again.");
        btn.innerText = "Confirm Booking";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
